name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo test -- --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo build

  backend-verify:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/squamed-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Tests, coverage gate, ktlint, warnings-as-errors
        run: ./gradlew test jacocoTestCoverageVerification ktlintCheck --no-daemon --console=plain
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/squamed-core/build/reports/jacoco/test/html
          retention-days: 14

  backend-package:
    name: Package Backend Boot Jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/squamed-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew bootJar --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: squamed-core-jar
          path: backend/squamed-core/build/libs/*.jar
          retention-days: 14

  e2e:
    name: End-to-End
    needs: [backend-package]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/squamed-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start infrastructure
        working-directory: infrastructure/docker
        run: docker compose up -d
      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: |
          nohup ./gradlew bootRun --no-daemon --console=plain > boot.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then echo "backend healthy"; exit 0; fi
            sleep 5
          done
          echo "backend did not become healthy" >&2
          tail -n 50 boot.log >&2
          exit 1
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14