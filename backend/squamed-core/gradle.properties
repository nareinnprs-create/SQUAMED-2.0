# Backend build root (CI runs Gradle from backend/squamed-core, so this file - not the repo-root
# one - sets the JVM heaps). Cold compileKotlin on the 7GB CI runners OOMs on the defaults.
# On a 15.3 GB dev host the Docker VM (7 GB) + Gradle + Kotlin daemons must leave Windows room:
# at 2 GB each the host ran out and the Docker engine was killed mid-suite, so both are 1.5 GB.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
# Test worker heap is bounded by maxHeapSize in build.gradle.kts
