# Backend build root (CI runs Gradle from backend/squamed-core, so this file - not the repo-root
# one - sets the JVM heaps). Cold compileKotlin on the 7GB CI runners OOMs on the defaults.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
# Test worker heap is bounded by maxHeapSize in build.gradle.kts
