spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    connection-timeout: 10s
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.squamed: INFO
    org.hibernate.SQL: WARN
    org.apache.kafka: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","traceId":"%X{traceId}","correlationId":"%X{correlationId}","thread":"%t","logger":"%c{36}","message":"%m"}%n'

squamed:
  security:
    jwt:
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  search:
    reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:true}