server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      # <= hikari pool / 2: every in-flight audited write holds two connections
      # (main + REQUIRES_NEW audit) - see the datasource hikari note
      max: 100

spring:
  application:
    name: squamed-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/squamed}
    username: ${DB_USERNAME:squamed}
    password: ${DB_PASSWORD:squamed_dev_password}
    hikari:
      # audited writes hold a main + a REQUIRES_NEW audit connection (nested, 2x demand);
      # Tomcat threads are capped at half the pool so the audit connection is always free
      # (load 00.17 finding: undersized or over-committed pools turn into 30s wedges)
      maximum-pool-size: 200
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: squamed-core
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  metrics:
    distribution:
      percentiles-histogram:
        # RED dashboards + the p95 SLO (NFR §6) need latency buckets, not just _count/_sum.
        http.server.requests: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# OTel traces -> OTLP collector (09-INFRASTRUCTURE.md §3: HTTP->service->DB->WS; head sampler
# AlwaysOn here, tail sampling in the collector keeps 100% of error traces + 10% baseline).
# Metrics stay on Micrometer/Prometheus, logs stay on stdout.
otel:
  traces:
    exporter: otlp
    sampler: parentbased_traceidratio
    sampler.arg: 1.0
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

squamed:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-key-change-in-production-0123456789abcdef}
      # 00.03 hardening: key rotation. Empty keys map = legacy single-secret mode.
      # To rotate: set env SQUAMED_SECURITY_JWT_KEYS={old-kid:secret,new-kid:secret}
      # + SQUAMED_SECURITY_JWT_ACTIVE_KID=new-kid, deploy; old-kid tokens keep verifying
      # via kid pinning until TTL expiry, then drop old-kid from the map.
      keys: {}
      active-kid: ${JWT_ACTIVE_KID:default}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  ai:
    stt:
      provider: ${AI_STT_PROVIDER:echo}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      whisper-model: ${OPENAI_WHISPER_MODEL:whisper-1}
  search:
    enabled: true
    opensearch-uris: ${OPENSEARCH_URIS:http://localhost:9200}
    reindex-on-startup: ${SEARCH_REINDEX_ON_STARTUP:true}
  photos:
    # S3 API object storage for patient photos — MinIO (pgsty/silo) in dev, S3 in prod.
    enabled: ${PHOTOS_ENABLED:true}
    endpoint: ${PHOTOS_ENDPOINT:http://localhost:9000}
    region: ${PHOTOS_REGION:us-east-1}
    access-key: ${PHOTOS_ACCESS_KEY:squamed}
    secret-key: ${PHOTOS_SECRET_KEY:squamed_dev_password}
    bucket: ${PHOTOS_BUCKET:squamed-patient-photos}
    path-style: ${PHOTOS_PATH_STYLE:true}

logging:
  level:
    root: INFO
    com.squamed: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","traceId":"%X{traceId}","correlationId":"%X{correlationId}","thread":"%t","logger":"%c{36}","message":"%m"}%n'