org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# CI runners are 7GB; one JVM (compiler in-process) avoids the second daemon's heap.
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
# Test worker heap is bounded by maxHeapSize in build.gradle.kts
