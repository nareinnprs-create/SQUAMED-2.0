global:
  resolve_timeout: 5m
  # Slack paging (SLACK_API_URL env override) is wired per deployment; the dev receiver below
  # is a plain webhook. See docker-compose.prod.yml for the receiver wiring.

route:
  receiver: "squamed-ops"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: "squamed-ops-critical"
      continue: false

receivers:
  - name: "squamed-ops"
    webhook_configs:
      - url: "http://host.docker.internal:9095/alerts"
        send_resolved: true
        max_alerts: 50

  - name: "squamed-ops-critical"
    webhook_configs:
      - url: "http://host.docker.internal:9095/alerts/critical"
        send_resolved: true
        max_alerts: 50

inhibit_rules:
  - source_matchers: ["severity = critical"]
    target_matchers: ["severity = warning"]
    equal: ["alertname"]