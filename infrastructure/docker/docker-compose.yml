name: squamed-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: squamed-postgres
    environment:
      POSTGRES_DB: squamed
      POSTGRES_USER: squamed
      POSTGRES_PASSWORD: squamed_dev_password
    # dev-scale connection headroom: load test drives 200 concurrent audited writes,
    # each holding a main + a REQUIRES_NEW audit connection (100 default was exhausted)
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squamed"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: squamed-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: squamed-kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: squamed-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  minio:
    # minio/minio images were deleted from Docker Hub and quay.io by MinIO (2025-2026); pgsty/silo
    # is the maintained AGPL MinIO fork that honors the same MINIO_* env and S3 API.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: squamed-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: squamed
      MINIO_ROOT_PASSWORD: squamed_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: squamed-temporal
    depends_on:
      - postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=squamed
      - POSTGRES_PWD=squamed_dev_password
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/etc/temporal

  temporal-ui:
    image: temporalio/ui:2.29.0
    container_name: squamed-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "8088:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: squamed-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: squamed-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=squamed
      - GF_SECURITY_ADMIN_PASSWORD=squamed_dev_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3005
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # 00.16: provisioned datasource + RED/business dashboards (squamed-red.json).
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 00.16: OTLP trace endpoint (tail sampling: 100% of error traces + 10% baseline) and the
  # alert pipeline (Prometheus -> alertmanager -> webhook receiver on the host).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: squamed-otel-collector
    volumes:
      - ../observability/otel-collector.yml:/etc/otel/config.yaml
    command: ['--config=/etc/otel/config.yaml']
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: squamed-alertmanager
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    ports:
      - "9093:9093"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  opensearch_data:
  minio_data:
  temporal_data:
  prometheus_data:
  grafana_data: